<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#071412" />
  <title>EVERLIFE — Your story, simulated</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div id="app">
    <main style="min-height:100vh;display:grid;place-items:center;background:#06100e;color:#eaf3ef;font-family:system-ui,sans-serif">
      <section style="text-align:center;padding:32px">
        <div style="width:44px;height:44px;border:1px solid #70f0be;border-radius:50%;display:grid;place-items:center;margin:0 auto 18px;color:#70f0be">E</div>
        <h1 style="font:400 38px Georgia,serif;margin:0 0 10px">Opening Everlife…</h1>
        <p style="color:#8ea69d;margin:0">Preparing your world.</p>
      </section>
    </main>
  </div>
  <div id="toastHost" class="toast-host" aria-live="polite"></div>
  <script>
    window.__everlifeBootError = function (message) {
      var app = document.getElementById('app');
      if (!app) return;
      app.innerHTML = '<main style="min-height:100vh;display:grid;place-items:center;background:#06100e;color:#eaf3ef;font-family:system-ui,sans-serif;padding:24px"><section style="max-width:520px;text-align:center"><h1 style="font:400 38px Georgia,serif">Everlife needs a fresh start</h1><p style="color:#8ea69d;line-height:1.6">The embedded viewer could not finish loading the game. Your files are safe.</p><button onclick="try{localStorage.removeItem(\'everlife-save-v1\')}catch(e){}location.reload()" style="border:0;border-radius:12px;background:#70f0be;color:#07100e;padding:14px 20px;font-weight:800;cursor:pointer">Repair and open game</button><p style="font-size:11px;color:#536b63;margin-top:18px">' + String(message || 'Unknown loading error').replace(/[<&]/g, '') + '</p></section></main>';
    };
    window.addEventListener('error', function (event) {
      if (event.filename || event.message) window.__everlifeBootError(event.message);
    });
  </script>
  <script src="./world-data.js"></script>
  <script src="./app.js"></script>
</body>
</html>
